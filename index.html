<!DOCTYPE html>
<html>
  <head>
    <title>Todo App</title>
    <link href="https://fonts.googleapis.com/css?family=Lato:300,400,700" rel="stylesheet">
    <link rel="stylesheet" href="style.css" media="screen" charset="utf-8">
  </head>
  <body>
    <aside class="planning-tip">
      <img class="planning-tip__image" src="./eisenhower-matrix.jpg" alt="The Eisenhower matrix">
      <a class="planning-tip__more-info" href="https://goal-life.com/page/method/matrix-eisenhower">Want more details?</a>
    </aside>
    <main class="task-planner">
      <h1 class="hidden">Todo App</h1>
      <section id="add-item" class="section add-item">
        <h2 class="section__title">
          <label for="new-task">Add Item</label>
        </h2>
        <div class="add-item__row">
          <input id="new-task" class="add-item__input" type="text">
          <button class="add-item__button">Add</button>
        </div>
      </section>
      <section class="section">
        <h2 class="section__title">Todo</h2>
        <ul id="todo">
          <li class="task-item">
            <input class="task-item__checkbox" type="checkbox">
            <label class="task-item__label">Pay Bills</label>
            <input type="text" class="task-item__input">
            <button class="task-item__button task-item__button_edit">Edit</button>
            <button class="task-item__button task-item__button_delete">
              <img class="task-item__delete-icon" src="./remove.svg" alt="delete">
            </button>
          </li>
          <li class="task-item task-item_edit-mode">
            <input class="task-item__checkbox"  type="checkbox">
            <label class="task-item__label">Go Shopping</label>
            <input type="text" value="Go Shopping" class="task-item__input">
            <button class="task-item__button task-item__button_edit">Save</button>
            <button class="task-item__button task-item__button_delete">
              <img class="task-item__delete-icon" src="./remove.svg" alt="delete">
            </button>
          </li>
        </ul>
      </section>
      <section class="section section_completed">
        <h2 class="section__title">Completed</h2>
        <ul id="completed">
          <li class="task-item">
            <input class="task-item__checkbox" type="checkbox" checked>
            <label class="task-item__label">See the Doctor</label>
            <input type="text" class="task-item__input">
            <button class="task-item__button task-item__button_edit">Edit</button>
            <button class="task-item__button task-item__button_delete">
              <img class="task-item__delete-icon" src="./remove.svg" alt="delete">
            </button>
          </li>
        </ul>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
